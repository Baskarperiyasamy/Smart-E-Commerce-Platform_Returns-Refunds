<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up · Smart E-Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="navbar">
  <div class="brand">Smart<span>Cart</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="orders.html">My Orders</a>
    <a href="notifications.html" class="nav-bell" title="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="bell-badge" id="bellBadge" style="display:none;">0</span>
    </a>
    <a href="database.html">Database</a>
  </nav>
</div>

<div class="auth-wrap">
  <h1>Create your account</h1>
  <p class="sub">Join SmartCart and start shopping in seconds.</p>

  <div id="alertBox" class="alert"></div>

  <form id="registerForm">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" required placeholder="Jane Doe" />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script src="js/api.js"></script>
<script>
  const alertBox = document.getElementById("alertBox");

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await AuthAPI.register(name, email, password);
      alertBox.className = "alert success";
      alertBox.textContent = "Account created! Redirecting to login...";
      setTimeout(() => (window.location.href = "login.html"), 1200);
    } catch (err) {
      alertBox.className = "alert error";
      alertBox.textContent = err.message;
    }
  });
</script>

</body>
</html>
